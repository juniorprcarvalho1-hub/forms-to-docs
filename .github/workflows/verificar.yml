name: Verificar aplicação
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Preparar lockfile do teste Chromium
        working-directory: tests/renderizador
        run: |
          bun install
          node -e "console.log('AUTOMACAO_RENDER_LOCK_BASE64='+require('fs').readFileSync('bun.lock').toString('base64'))"
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bun run build
      - name: Verificar impressão em Chromium
        working-directory: tests/renderizador
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          bun verificar.ts
