name: Verificar aplicação
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Preparar lockfile das bibliotecas PDF e HTML
        run: |
          bun install --lockfile-only
          node -e "console.log('AUTOMACAO_LOCK_BASE64='+require('fs').readFileSync('bun.lock').toString('base64'))"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bun run build
